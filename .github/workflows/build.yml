# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build npm packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: write-all

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@opendonationassistant"

      - name: Generate packages
        run: npm install && npm run generate

      # Persist generated packages for the publish jobs
      - uses: actions/upload-artifact@v4
        with:
          name: generated-packages
          path: generated
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - paywall-service
          - widget-service
          - streamelements-service
          - automation-service
          - subscriptions-service
          - history-service
          - kick-service
          - news-service
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@opendonationassistant"

      - name: Restore generated packages
        uses: actions/download-artifact@v4
        with:
          name: generated-packages
          path: generated

      - name: Install ${{ matrix.service }}
        run: npm install
        working-directory: "generated/${{ matrix.service }}"

      - uses: JS-DevTools/npm-publish@v3
        name: "Publish ${{ matrix.service }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          registry: "https://npm.pkg.github.com"
          package: "generated/${{ matrix.service }}"

      # - name: Install merged client
      #   run: npm install
      #   working-directory: "generated/client"
