openapi: 3.0.1
info:
  title: oda-media-service
  version: 1.0.0
paths:
  /commands/media/linkPayment:
    post:
      operationId: linkPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPayment.LinkPaymentCommand"
        required: true
      responses:
        "200":
          description: linkPayment 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpResponse_LinkPayment.LinkPaymentResponse_"
  /media/available:
    get:
      summary: Get available media
      description: "Retrieves available videos from YouTube based on query, playlist\
        \ ID, or video ID. At least one of query, playlistId, or videoId must be provided."
      operationId: available
      parameters:
      - name: query
        in: query
        description: Search query for YouTube videos
        explode: false
        schema:
          type: string
          nullable: true
      - name: playlistId
        in: query
        description: YouTube playlist ID to retrieve videos from
        explode: false
        schema:
          type: string
          nullable: true
      - name: videoId
        in: query
        description: Specific YouTube video ID
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: List of available videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "500":
          description: Internal server error or video not found
  /media/commands/mark-all-listened:
    post:
      operationId: markAllListened
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllListened.MarkAllListenedCommand"
        required: true
      responses:
        "200":
          description: markAllListened 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpResponse_Void_"
  /media/playlists/{playlistId}:
    get:
      summary: Get playlist videos
      description: Retrieves videos from a YouTube playlist with shuffled order
      operationId: get
      parameters:
      - name: playlistId
        in: path
        description: YouTube playlist ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Playlist with videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
  /media/video:
    get:
      summary: List authenticated user's videos
      description: Returns a list of ready videos for the authenticated recipient
      operationId: list
      responses:
        "200":
          description: List of user's videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoData"
        "401":
          description: Unauthorized - authentication required
    put:
      operationId: prepareVideo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareVideo.PrepareVideoCommand"
        required: true
      responses:
        "200":
          description: prepareVideo 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpResponse_PrepareVideo.PrepareVideoResponse_"
  /media/video/count:
    get:
      summary: Count ready videos for recipient
      description: Returns the number of ready videos for a given recipient ID
      operationId: countReadyVideos
      parameters:
      - name: recipientId
        in: query
        description: Recipient ID to count ready videos for
        required: true
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: Count of ready videos
          content:
            application/json:
              schema:
                type: integer
                format: int32
  /media/video/handled:
    get:
      operationId: listHandled
      parameters:
      - name: page
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: List of user's handled videos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoData"
        "401":
          description: Unauthorized - authentication required
  /media/video/{ids}:
    get:
      summary: Get videos by IDs
      description: Retrieves video data for a comma-separated list of video IDs
      operationId: get_1
      parameters:
      - name: ids
        in: path
        description: Comma-separated video IDs
        required: true
        schema:
          type: string
      responses:
        "200":
          description: List of videos retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoData"
  /media/video/{id}:
    patch:
      summary: Mark video as handled
      description: Marks a video as handled by its ID
      operationId: update
      parameters:
      - name: id
        in: path
        description: Video ID to mark as handled
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Video marked as handled
  /playlists:
    get:
      summary: List playlists
      description: Returns a paginated list of playlists for the authenticated user
      operationId: playlists
      parameters:
      - name: pageable
        in: query
        description: Pagination parameters
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Page of playlists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_Object_"
        "401":
          description: Unauthorized - authentication required
  /playlists/commands/create:
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylist.CreatePlaylistCommand"
        required: true
      responses:
        "200":
          description: create 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDto"
  /playlists/commands/delete:
    post:
      operationId: deletePlaylist
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePlaylist.DeletePlaylistCommand"
        required: true
      responses:
        "200":
          description: deletePlaylist 200 response
  /playlists/{playlistId}:
    get:
      summary: Get playlist by ID
      description: Returns a specific playlist by its ID for the authenticated user
      operationId: playlist
      parameters:
      - name: playlistId
        in: path
        description: Playlist ID
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Playlist details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDto"
        "401":
          description: Unauthorized - authentication required
        "404":
          description: Playlist not found
components:
  schemas:
    Amount:
      required:
      - currency
      - major
      - minor
      type: object
      properties:
        minor:
          type: integer
          format: int32
        major:
          type: integer
          format: int32
        currency:
          type: string
    AttributeHolder:
      required:
      - attributes
      type: object
      properties:
        attributes:
          $ref: "#/components/schemas/ConvertibleValues_Object_"
    ContentDetails:
      type: object
      properties:
        duration:
          type: string
          nullable: true
        regionRestriction:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/RegionRestriction"
        contentRating:
          type: object
          additionalProperties:
            type: string
          nullable: true
      description: Content details like duration
    ConversionService:
      type: object
    ConversionServiceProvider:
      required:
      - conversionService
      type: object
      properties:
        conversionService:
          $ref: "#/components/schemas/ConversionService"
    ConvertibleMultiValues_String_:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConvertibleValues_List_String__"
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          empty:
            type: boolean
    ConvertibleValues_Cookie_:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          empty:
            type: boolean
          conversionService:
            $ref: "#/components/schemas/ConversionService"
    ConvertibleValues_List_String__:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          empty:
            type: boolean
          conversionService:
            $ref: "#/components/schemas/ConversionService"
    ConvertibleValues_Object_:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          empty:
            type: boolean
          conversionService:
            $ref: "#/components/schemas/ConversionService"
    Cookie:
      required:
      - name
      - value
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        domain:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        httpOnly:
          type: boolean
        secure:
          type: boolean
        maxAge:
          type: integer
          format: int64
        sameSite:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/SameSite"
    Cookies:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConvertibleValues_Cookie_"
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          all:
            type: array
            items:
              $ref: "#/components/schemas/Cookie"
    CreatePlaylist.CreatePlaylistCommand:
      required:
      - items
      - title
      type: object
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistData.PlaylistItem"
    DeletePlaylist.DeletePlaylistCommand:
      required:
      - id
      type: object
      properties:
        id:
          type: string
    Headers:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConvertibleMultiValues_String_"
      - $ref: "#/components/schemas/ConvertibleValues_List_String__"
      - $ref: "#/components/schemas/ConversionServiceProvider"
    HttpHeaders:
      type: object
      allOf:
      - $ref: "#/components/schemas/Headers"
      - $ref: "#/components/schemas/ConvertibleMultiValues_String_"
      - $ref: "#/components/schemas/ConvertibleValues_List_String__"
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          conversionService:
            $ref: "#/components/schemas/ConversionService"
          empty:
            type: boolean
          keepAlive:
            type: boolean
          origin:
            type: string
            nullable: true
          authorization:
            type: string
            nullable: true
          contentType:
            type: string
            nullable: true
    HttpMessage_LinkPayment.LinkPaymentResponse_:
      required:
      - attributes
      - body
      - characterEncoding
      - contentType
      - headers
      - locale
      type: object
      allOf:
      - $ref: "#/components/schemas/MutableAttributeHolder"
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          headers:
            $ref: "#/components/schemas/HttpHeaders"
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
          body:
            $ref: "#/components/schemas/LinkPayment.LinkPaymentResponse"
          bodyWriter:
            nullable: true
            allOf:
            - $ref: "#/components/schemas/MessageBodyWriter_LinkPayment.LinkPaymentResponse_"
          characterEncoding:
            type: string
          locale:
            type: string
          contentLength:
            type: integer
            format: int64
          contentType:
            $ref: "#/components/schemas/MediaType"
    HttpMessage_PrepareVideo.PrepareVideoResponse_:
      required:
      - attributes
      - body
      - characterEncoding
      - contentType
      - headers
      - locale
      type: object
      allOf:
      - $ref: "#/components/schemas/MutableAttributeHolder"
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          headers:
            $ref: "#/components/schemas/HttpHeaders"
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
          body:
            $ref: "#/components/schemas/PrepareVideo.PrepareVideoResponse"
          bodyWriter:
            nullable: true
            allOf:
            - $ref: "#/components/schemas/MessageBodyWriter_PrepareVideo.PrepareVideoResponse_"
          characterEncoding:
            type: string
          locale:
            type: string
          contentLength:
            type: integer
            format: int64
          contentType:
            $ref: "#/components/schemas/MediaType"
    HttpMessage_Void_:
      required:
      - attributes
      - body
      - characterEncoding
      - contentType
      - headers
      - locale
      type: object
      allOf:
      - $ref: "#/components/schemas/MutableAttributeHolder"
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          headers:
            $ref: "#/components/schemas/HttpHeaders"
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
          body:
            $ref: "#/components/schemas/Void"
          bodyWriter:
            nullable: true
            allOf:
            - $ref: "#/components/schemas/MessageBodyWriter_Void_"
          characterEncoding:
            type: string
          locale:
            type: string
          contentLength:
            type: integer
            format: int64
          contentType:
            $ref: "#/components/schemas/MediaType"
    HttpResponse_LinkPayment.LinkPaymentResponse_:
      required:
      - attributes
      type: object
      allOf:
      - $ref: "#/components/schemas/HttpMessage_LinkPayment.LinkPaymentResponse_"
      - $ref: "#/components/schemas/MutableAttributeHolder"
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
          status:
            $ref: "#/components/schemas/HttpStatus"
          cookies:
            $ref: "#/components/schemas/Cookies"
    HttpResponse_PrepareVideo.PrepareVideoResponse_:
      required:
      - attributes
      type: object
      allOf:
      - $ref: "#/components/schemas/HttpMessage_PrepareVideo.PrepareVideoResponse_"
      - $ref: "#/components/schemas/MutableAttributeHolder"
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
          status:
            $ref: "#/components/schemas/HttpStatus"
          cookies:
            $ref: "#/components/schemas/Cookies"
    HttpResponse_Void_:
      required:
      - attributes
      type: object
      allOf:
      - $ref: "#/components/schemas/HttpMessage_Void_"
      - $ref: "#/components/schemas/MutableAttributeHolder"
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
          status:
            $ref: "#/components/schemas/HttpStatus"
          cookies:
            $ref: "#/components/schemas/Cookies"
    HttpStatus:
      type: string
      enum:
      - CONTINUE
      - SWITCHING_PROTOCOLS
      - PROCESSING
      - EARLY_HINTS
      - OK
      - CREATED
      - ACCEPTED
      - NON_AUTHORITATIVE_INFORMATION
      - NO_CONTENT
      - RESET_CONTENT
      - PARTIAL_CONTENT
      - MULTI_STATUS
      - ALREADY_IMPORTED
      - IM_USED
      - MULTIPLE_CHOICES
      - MOVED_PERMANENTLY
      - FOUND
      - SEE_OTHER
      - NOT_MODIFIED
      - USE_PROXY
      - SWITCH_PROXY
      - TEMPORARY_REDIRECT
      - PERMANENT_REDIRECT
      - BAD_REQUEST
      - UNAUTHORIZED
      - PAYMENT_REQUIRED
      - FORBIDDEN
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - NOT_ACCEPTABLE
      - PROXY_AUTHENTICATION_REQUIRED
      - REQUEST_TIMEOUT
      - CONFLICT
      - GONE
      - LENGTH_REQUIRED
      - PRECONDITION_FAILED
      - REQUEST_ENTITY_TOO_LARGE
      - REQUEST_URI_TOO_LONG
      - UNSUPPORTED_MEDIA_TYPE
      - REQUESTED_RANGE_NOT_SATISFIABLE
      - EXPECTATION_FAILED
      - I_AM_A_TEAPOT
      - ENHANCE_YOUR_CALM
      - MISDIRECTED_REQUEST
      - UNPROCESSABLE_ENTITY
      - LOCKED
      - FAILED_DEPENDENCY
      - TOO_EARLY
      - UPGRADE_REQUIRED
      - PRECONDITION_REQUIRED
      - TOO_MANY_REQUESTS
      - REQUEST_HEADER_FIELDS_TOO_LARGE
      - NO_RESPONSE
      - BLOCKED_BY_WINDOWS_PARENTAL_CONTROLS
      - UNAVAILABLE_FOR_LEGAL_REASONS
      - REQUEST_HEADER_TOO_LARGE
      - INTERNAL_SERVER_ERROR
      - NOT_IMPLEMENTED
      - BAD_GATEWAY
      - SERVICE_UNAVAILABLE
      - GATEWAY_TIMEOUT
      - HTTP_VERSION_NOT_SUPPORTED
      - VARIANT_ALSO_NEGOTIATES
      - INSUFFICIENT_STORAGE
      - LOOP_DETECTED
      - BANDWIDTH_LIMIT_EXCEEDED
      - NOT_EXTENDED
      - NETWORK_AUTHENTICATION_REQUIRED
      - CONNECTION_TIMED_OUT
    Id:
      type: object
      properties:
        kind:
          type: string
          nullable: true
        videoId:
          type: string
          nullable: true
    LinkPayment.LinkPaymentCommand:
      required:
      - mediaIds
      - paymentId
      - recipientId
      type: object
      properties:
        recipientId:
          type: string
        paymentId:
          type: string
        mediaIds:
          type: array
          items:
            type: string
    LinkPayment.LinkPaymentResponse:
      required:
      - requiredAmount
      type: object
      properties:
        requiredAmount:
          $ref: "#/components/schemas/Amount"
    MarkAllListened.MarkAllListenedCommand:
      type: object
    MediaType:
      required:
      - name
      - parametersMap
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        subtype:
          type: string
        extension:
          type: string
        parameters:
          $ref: "#/components/schemas/OptionalValues_String_"
        parametersMap:
          type: object
          additionalProperties:
            type: string
        quality:
          type: string
        qualityAsNumber:
          type: number
        version:
          type: string
        charset:
          type: string
          nullable: true
        textBased:
          type: boolean
    MessageBodyWriter_LinkPayment.LinkPaymentResponse_:
      type: object
      properties:
        blocking:
          type: boolean
    MessageBodyWriter_PrepareVideo.PrepareVideoResponse_:
      type: object
      properties:
        blocking:
          type: boolean
    MessageBodyWriter_Void_:
      type: object
      properties:
        blocking:
          type: boolean
    MutableAttributeHolder:
      required:
      - attributes
      type: object
      allOf:
      - $ref: "#/components/schemas/AttributeHolder"
      - type: object
        properties:
          attributes:
            $ref: "#/components/schemas/MutableConvertibleValues_Object_"
    MutableConvertibleValues_Object_:
      type: object
      allOf:
      - $ref: "#/components/schemas/ConvertibleValues_Object_"
      - $ref: "#/components/schemas/ConversionServiceProvider"
      - type: object
        properties:
          conversionService:
            $ref: "#/components/schemas/ConversionService"
    OptionalValues_String_:
      type: object
      properties:
        empty:
          type: boolean
    Page_Object_:
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_Object_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Pageable:
      required:
      - size
      - sort
      type: object
      allOf:
      - $ref: "#/components/schemas/Sort"
      - type: object
        properties:
          number:
            type: integer
            format: int32
          size:
            type: integer
            format: int32
          mode:
            $ref: "#/components/schemas/Pageable.Mode"
          sort:
            $ref: "#/components/schemas/Sort"
    Pageable.Mode:
      type: string
      enum:
      - CURSOR_NEXT
      - CURSOR_PREVIOUS
      - OFFSET
    Playlist:
      type: object
      properties:
        items:
          type: array
          description: List of videos in the playlist
          items:
            $ref: "#/components/schemas/Video"
        title:
          type: string
          description: Playlist title
      description: Playlist containing videos
    PlaylistData.PlaylistItem:
      required:
      - src
      - title
      type: object
      properties:
        title:
          type: string
        src:
          type: string
    PlaylistDto:
      type: object
      properties:
        id:
          type: string
          description: Unique playlist identifier
        title:
          type: string
          description: Playlist title
        ownerId:
          type: string
          description: Owner user ID
        items:
          type: array
          description: List of playlist items
          items:
            $ref: "#/components/schemas/PlaylistData.PlaylistItem"
      description: Playlist data transfer object
    PrepareVideo.PrepareVideoCommand:
      required:
      - recipientId
      - url
      type: object
      properties:
        url:
          type: string
        recipientId:
          type: string
    PrepareVideo.PrepareVideoResponse:
      required:
      - cost
      - id
      - originId
      - provider
      - thumbnail
      - title
      - url
      type: object
      properties:
        id:
          type: string
        originId:
          type: string
        provider:
          type: string
        url:
          type: string
        title:
          type: string
        thumbnail:
          type: string
        cost:
          $ref: "#/components/schemas/Amount"
    RegionRestriction:
      type: object
      properties:
        blocked:
          type: array
          nullable: true
          items:
            type: string
    SameSite:
      type: string
      enum:
      - Lax
      - Strict
      - None
      x-enum-varnames:
      - Lax
      - Strict
      - None
    Slice_Object_:
      required:
      - content
      - pageable
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Snippet:
      type: object
      properties:
        resourceId:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Id"
        title:
          type: string
          nullable: true
        thumbnails:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Thumbnail"
          nullable: true
      description: "Video snippet with title, description, thumbnails"
    Sort:
      required:
      - orderBy
      type: object
      properties:
        orderBy:
          type: array
          items:
            $ref: "#/components/schemas/Sort.Order"
    Sort.Order:
      required:
      - direction
      - ignoreCase
      - property
      type: object
      properties:
        ignoreCase:
          type: boolean
        direction:
          $ref: "#/components/schemas/Sort.Order.Direction"
        property:
          type: string
        ascending:
          type: boolean
    Sort.Order.Direction:
      type: string
      enum:
      - ASC
      - DESC
    Statistics:
      type: object
      properties:
        viewCount:
          type: string
          nullable: true
      description: "Video statistics (views, likes, etc.)"
    Thumbnail:
      type: object
      properties:
        url:
          type: string
          nullable: true
        width:
          type: string
          nullable: true
        height:
          type: string
          nullable: true
    Video:
      type: object
      properties:
        id:
          type: string
          description: Video ID
          nullable: true
        snippet:
          description: "Video snippet with title, description, thumbnails"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Snippet"
        contentDetails:
          description: Content details like duration
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ContentDetails"
        statistics:
          description: "Video statistics (views, likes, etc.)"
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Statistics"
      description: YouTube video data
    VideoData:
      required:
      - system
      type: object
      properties:
        id:
          type: string
          description: Unique video identifier
        originId:
          type: string
          description: Original video ID from provider
        provider:
          type: string
          description: "Video provider (e.g., youtube)"
        url:
          type: string
          description: Video URL
        title:
          type: string
          description: Video title
        thumbnail:
          type: string
          description: Video thumbnail URL
        status:
          type: string
          description: Video status
        owner:
          type: string
          description: Owner of the video
          nullable: true
        recipientId:
          type: string
