openapi: 3.0.1
info:
  title: oda-recipient-service
  version: 1.0.0
paths:
  /otp/create:
    post:
      operationId: createOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOtpCommand"
        required: true
      responses:
        "200":
          description: createOtp 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOtpCommandResponse"
  /otp/exchange:
    post:
      operationId: exchangeOtp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeOtpCommand"
        required: true
      responses:
        "200":
          description: exchangeOtp 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeOtpCommandResponse"
  /recipients/commands/changePassword:
    post:
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePassword.ChangePasswordCommand"
        required: true
      responses:
        "200":
          description: changePassword 200 response
  /recipients/commands/create-recipient:
    post:
      operationId: createRecipient
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipient.CreateRecipientCommand"
        required: true
      responses:
        "200":
          description: createRecipient 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRecipient.CreateRecipientCommandResponse"
  /recipients/commands/link-discord:
    post:
      operationId: linkDiscord
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkDiscord.LinkDiscordCommand"
        required: true
      responses:
        "200":
          description: linkDiscord 200 response
  /recipients/commands/link-donationalerts:
    post:
      operationId: linkDonationAlerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkDonationAlerts.GetDonationAlertsTokenCommand"
        required: true
      responses:
        "200":
          description: linkDonationAlerts 200 response
  /recipients/commands/link-kick:
    post:
      operationId: linkKick
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkKick.LinkKickCommand"
        required: true
      responses:
        "200":
          description: linkKick 200 response
  /recipients/commands/link-twitch:
    post:
      operationId: linkTwitch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTwitch.GetTwitchTokenCommand"
        required: true
      responses:
        "200":
          description: linkTwitch 200 response
  /recipients/commands/link-vklive:
    post:
      operationId: linkVKlive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkVklive.GetVKLiveTokenCommand"
        required: true
      responses:
        "200":
          description: linkVKlive 200 response
  /recipients/commands/update-email:
    post:
      operationId: updateEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmail.UpdateEmailCommand"
        required: true
      responses:
        "200":
          description: updateEmail 200 response
  /recipients/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Recipient Settings with Features
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsController.SettingsDto"
  /recipients/tokens:
    get:
      operationId: listTokens
      responses:
        "200":
          description: listTokens 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TokenController.TokenDto"
  /recipients/tokens/deletetoken:
    post:
      operationId: deleteToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteToken.DeleteTokenCommand"
        required: true
      responses:
        "200":
          description: deleteToken 200 response
  /recipients/tokens/get-access-token:
    post:
      operationId: getAccessToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAccessToken.GetAccessTokenCommand"
        required: true
      responses:
        "200":
          description: Fresh Access Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccessToken.AccessToken"
        "401":
          description: Unauthorized or not found
  /recipients/tokens/get-twitch-access-token:
    post:
      operationId: getTwitchAccessToken
      responses:
        "200":
          description: Twitch access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTwitchAccessToken.AccessToken"
        "401":
          description: Unauthorized or not found
  /recipients/tokens/settoken:
    post:
      operationId: setToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetToken.SetTokenCommand"
        required: true
      responses:
        "200":
          description: setToken 200 response
  /recipients/tokens/toggletoken:
    post:
      operationId: toggleToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleToken.ToggleTokenCommand"
        required: true
      responses:
        "200":
          description: toggleToken 200 response
  /recipients/{recipientId}/donaters:
    get:
      operationId: list
      parameters:
      - name: recipientId
        in: path
        required: true
        schema:
          type: string
      - name: period
        in: query
        required: true
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: list 200 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/Amount"
  /session:
    get:
      operationId: test
      responses:
        "200":
          description: test 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
components:
  schemas:
    Amount:
      required:
      - currency
      - major
      - minor
      type: object
      properties:
        minor:
          type: integer
          format: int32
        major:
          type: integer
          format: int32
        currency:
          type: string
    ChangePassword.ChangePasswordCommand:
      required:
      - newPassword
      - oldPassword
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
    CreateOtpCommand:
      type: object
    CreateOtpCommandResponse:
      required:
      - otp
      type: object
      properties:
        otp:
          type: string
    CreateRecipient.CreateRecipientCommand:
      required:
      - nickname
      type: object
      properties:
        nickname:
          type: string
        password:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
    CreateRecipient.CreateRecipientCommandResponse:
      required:
      - password
      type: object
      properties:
        password:
          type: string
    DeleteToken.DeleteTokenCommand:
      required:
      - id
      type: object
      properties:
        id:
          type: string
    ExchangeOtpCommand:
      type: object
    ExchangeOtpCommandResponse:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    GetAccessToken.AccessToken:
      required:
      - token
      type: object
      properties:
        token:
          type: string
    GetAccessToken.GetAccessTokenCommand:
      required:
      - tokenId
      type: object
      properties:
        tokenId:
          type: string
    GetTwitchAccessToken.AccessToken:
      required:
      - token
      type: object
      properties:
        token:
          type: string
    Info:
      required:
      - id
      - logged
      type: object
      properties:
        logged:
          type: boolean
        id:
          type: string
    LinkDiscord.LinkDiscordCommand:
      required:
      - authorizationCode
      type: object
      properties:
        authorizationCode:
          type: string
    LinkDonationAlerts.GetDonationAlertsTokenCommand:
      required:
      - authorizationCode
      type: object
      properties:
        authorizationCode:
          type: string
    LinkKick.LinkKickCommand:
      required:
      - authorizationCode
      - codeVerifier
      type: object
      properties:
        authorizationCode:
          type: string
        codeVerifier:
          type: string
    LinkTwitch.GetTwitchTokenCommand:
      required:
      - authorizationCode
      type: object
      properties:
        authorizationCode:
          type: string
    LinkVklive.GetVKLiveTokenCommand:
      required:
      - authorizationCode
      type: object
      properties:
        authorizationCode:
          type: string
    SetToken.SetTokenCommand:
      required:
      - id
      - settings
      - system
      - token
      - type
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        type:
          type: string
        system:
          type: string
        settings:
          type: object
          additionalProperties:
            type: object
    SettingsController.Feature:
      required:
      - name
      - status
      type: object
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/SettingsController.FeatureStatus"
    SettingsController.FeatureStatus:
      type: string
      enum:
      - ENABLED
      - DISABLED
    SettingsController.LogLevel:
      type: string
      enum:
      - TRACE
      - DEBUG
      - INFO
      - WARN
      - ERROR
      - DISABLED
    SettingsController.LogLevels:
      required:
      - level
      - name
      type: object
      properties:
        name:
          type: string
        level:
          $ref: "#/components/schemas/SettingsController.LogLevel"
    SettingsController.SettingsDto:
      required:
      - features
      - id
      - logLevels
      - recipientId
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/SettingsController.Feature"
        logLevels:
          type: array
          items:
            $ref: "#/components/schemas/SettingsController.LogLevels"
    ToggleToken.ToggleTokenCommand:
      required:
      - enabled
      - id
      type: object
      properties:
        id:
          type: string
        enabled:
          type: boolean
    TokenController.TokenDto:
      required:
      - enabled
      - id
      - settings
      - system
      - token
      - type
      type: object
      properties:
        id:
          type: string
        system:
          type: string
        type:
          type: string
        token:
          type: string
        enabled:
          type: boolean
        settings:
          type: object
          additionalProperties:
            type: object
    UpdateEmail.UpdateEmailCommand:
      required:
      - email
      type: object
      properties:
        email:
          type: string
