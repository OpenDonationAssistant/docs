openapi: 3.0.1
info:
  title: ODA Files Service
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 1.0.0
paths:
  /catalog:
    get:
      operationId: getCatalog
      parameters:
      - name: category
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: page
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        explode: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: getCatalog 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
  /files/{name}:
    get:
      operationId: get
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: get 200 response
          content:
            application/octet-stream:
              schema:
                type: object
    put:
      operationId: put
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: public
        in: query
        explode: false
        schema:
          type: boolean
          nullable: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: put 200 response
          content:
            text/plain:
              schema:
                type: object
components:
  schemas:
    CatalogItemView:
      required:
      - category
      - id
      - name
      - recipientId
      - type
      - url
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        recipientId:
          type: string
        category:
          type: string
        type:
          type: string
        url:
          type: string
    CatalogPage:
      required:
      - items
      - page
      - size
      - total
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogItemView"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
