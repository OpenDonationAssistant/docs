openapi: 3.0.1
info:
  title: ODA Automation Service
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 0.9.0
tags:
- name: Automation
  description: Automation operations for managing rules and variables
paths:
  /alerts:
    get:
      summary: List alerts
      description: Retrieves paginated alerts for the authenticated user with optional
        filters
      operationId: listAlerts
      parameters:
      - name: after
        in: query
        explode: false
        schema:
          type: string
          format: date-time
          nullable: true
      - name: before
        in: query
        explode: false
        schema:
          type: string
          format: date-time
          nullable: true
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated list of alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAlertsApi.GetAlertsApiResponse"
        "401":
          description: Unauthorized - user not authenticated
  /automation:
    get:
      tags:
      - Automation
      summary: Get automation state
      description: Retrieves the complete automation state including all rules and
        variables
      operationId: getState
      responses:
        "200":
          description: Complete automation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationDto"
        "401":
          description: Unauthorized - user not authenticated
  /automation/commands/set-enabled:
    post:
      summary: Toggle automation rule enabled state
      description: Toggles the enabled field for an automation rule by id for the
        authenticated user
      operationId: setEnabled
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnabled.SetEnabledCommand"
        required: true
      responses:
        "200":
          description: Rule enabled state toggled
        "401":
          description: Unauthorized - user not authenticated
        "404":
          description: Rule not found
  /automation/commands/set-state:
    post:
      summary: Set automation state
      description: Updates automation variables and rules for the authenticated user
      operationId: setState
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetState.SetStateCommand"
        required: true
      responses:
        "200":
          description: State successfully updated
        "401":
          description: Unauthorized - user not authenticated
  /automation/commands/trigger-rule:
    post:
      summary: Trigger automation rule by command
      description: "Runs an iteration for the automation rule with the given id, using\
        \ the command as the trigger source"
      operationId: triggerRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRuleApi.TriggerRuleCommand"
        required: true
      responses:
        "200":
          description: Rule triggered
        "401":
          description: Unauthorized - user not authenticated
        "404":
          description: Rule not found
  /automation/rules:
    get:
      tags:
      - Automation
      summary: List automation rules
      description: Retrieves paginated automation rules for the authenticated user
      operationId: listAutomations
      parameters:
      - name: page
        in: query
        description: Zero-indexed page number (0-based)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          example: 0
      - name: size
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: "Sorting criteria in format: property,asc|desc"
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated list of automation rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationOperationsApi.ListAutomationsResponse"
        "401":
          description: Unauthorized - user not authenticated
  /automation/variables:
    get:
      tags:
      - Automation
      summary: List automation variables
      description: Retrieves paginated automation variables for the authenticated
        user
      operationId: listVariables
      parameters:
      - name: page
        in: query
        description: Zero-indexed page number (0-based)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          example: 0
      - name: size
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: "Sorting criteria in format: property,asc|desc"
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated list of automation variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationOperationsApi.ListVariablesResponse"
        "401":
          description: Unauthorized - user not authenticated
  /panels:
    get:
      summary: List panels
      description: Retrieves paginated panels for the authenticated user
      operationId: listPanels
      parameters:
      - name: page
        in: query
        description: Zero-indexed page number (0-based)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          example: 0
      - name: size
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: "Sorting criteria in format: property,asc|desc"
        schema:
          type: string
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated list of panels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelsApi.ListPanelsResponse"
        "401":
          description: Unauthorized - user not authenticated
  /panels/commands/create-panel:
    post:
      summary: Create panel
      description: Creates a new panel for the authenticated user
      operationId: createPanel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePanelApi.CreatePanelCommand"
        required: true
      responses:
        "200":
          description: Created panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePanelApi.CreatePanelResponse"
        "401":
          description: Unauthorized - user not authenticated
  /panels/commands/delete-panel:
    post:
      summary: Delete panel
      description: Deletes a panel by id for the authenticated user
      operationId: deletePanel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  $ref: "#/components/schemas/DeletePanelApi.DeletePanelCommand"
        required: true
      responses:
        "200":
          description: Panel deleted
        "401":
          description: Unauthorized - user not authenticated
  /panels/commands/update-panel:
    post:
      summary: Update panel
      description: Updates a panel by id for the authenticated user
      operationId: updatePanel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePanelApi.UpdatePanelCommand"
        required: true
      responses:
        "200":
          description: Updated panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "401":
          description: Unauthorized - user not authenticated
        "404":
          description: Panel not found
  /panels/{id}:
    get:
      summary: Get panel
      description: Retrieves a panel by id for the authenticated user
      operationId: getPanel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Panel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelDto"
        "401":
          description: Unauthorized - user not authenticated
        "404":
          description: Panel not found
  /word-blacklist:
    get:
      summary: Get word blacklist
      description: Retrieves the word blacklist for the authenticated user
      operationId: getBlacklist
      responses:
        "200":
          description: Blacklist entries for the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WordFilterData"
        "401":
          description: Unauthorized - user not authenticated
  /word-blacklist/commands/update:
    post:
      summary: Update word blacklist
      description: Creates or updates the word blacklist for the authenticated user
      operationId: updateBlacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBlacklistApi.UpdateBlacklistCommand"
        required: true
      responses:
        "200":
          description: Blacklist updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordFilterData"
        "401":
          description: Unauthorized - user not authenticated
components:
  schemas:
    AlertData:
      required:
      - createdAt
      - hidden
      - id
      - recipientId
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        nickname:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        amount:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Amount"
        media:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/AlertData.AlertMedia"
        levelName:
          type: string
          nullable: true
        count:
          type: integer
          format: int32
          nullable: true
        createdAt:
          type: string
          format: date-time
        hidden:
          type: boolean
    AlertData.AlertMedia:
      required:
      - url
      type: object
      properties:
        url:
          type: string
    Amount:
      required:
      - currency
      - major
      - minor
      type: object
      properties:
        minor:
          type: integer
          format: int32
        major:
          type: integer
          format: int32
        currency:
          type: string
    AutomationActionDto:
      required:
      - id
      - value
      type: object
      properties:
        id:
          minLength: 1
          type: string
        value:
          type: object
          additionalProperties:
            type: object
    AutomationDto:
      required:
      - rules
      - variables
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRuleDto"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/AutomationVariableDto"
    AutomationOperationsApi.ListAutomationsResponse:
      type: object
      allOf:
      - $ref: "#/components/schemas/Page_AutomationRuleDto_"
      - $ref: "#/components/schemas/Slice_AutomationRuleDto_"
    AutomationOperationsApi.ListVariablesResponse:
      type: object
      allOf:
      - $ref: "#/components/schemas/Page_AutomationVariableDto_"
      - $ref: "#/components/schemas/Slice_AutomationVariableDto_"
    AutomationRuleDto:
      required:
      - actions
      - enabled
      - id
      - name
      - triggers
      type: object
      properties:
        id:
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/AutomationTriggerDto"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationActionDto"
        enabled:
          type: boolean
    AutomationTriggerDto:
      required:
      - id
      - value
      type: object
      properties:
        id:
          minLength: 1
          type: string
        value:
          type: object
          additionalProperties:
            type: object
    AutomationVariableDto:
      required:
      - id
      - name
      - type
      - value
      type: object
      properties:
        id:
          minLength: 1
          type: string
        name:
          type: string
        type:
          minLength: 1
          type: string
        value:
          type: string
    CreatePanelApi.CreatePanelCommand:
      required:
      - cards
      - name
      type: object
      properties:
        name:
          minLength: 1
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/PanelDto.PanelCardDto"
    CreatePanelApi.CreatePanelResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
    DeletePanelApi.DeletePanelCommand:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
    GetAlertsApi.GetAlertsApiResponse:
      type: object
      allOf:
      - $ref: "#/components/schemas/Page_AlertData_"
      - $ref: "#/components/schemas/Slice_AlertData_"
    Page_AlertData_:
      required:
      - totalPages
      - totalSize
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_AlertData_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Page_AutomationRuleDto_:
      required:
      - totalPages
      - totalSize
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_AutomationRuleDto_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Page_AutomationVariableDto_:
      required:
      - totalPages
      - totalSize
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_AutomationVariableDto_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Page_PanelDto_:
      required:
      - totalPages
      - totalSize
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_PanelDto_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Pageable:
      required:
      - mode
      - number
      - size
      - sort
      type: object
      allOf:
      - $ref: "#/components/schemas/Sort"
      - type: object
        properties:
          number:
            type: integer
            format: int32
          size:
            type: integer
            format: int32
          mode:
            $ref: "#/components/schemas/Pageable.Mode"
          sort:
            $ref: "#/components/schemas/Sort"
    Pageable.Mode:
      type: string
      enum:
      - CURSOR_NEXT
      - CURSOR_PREVIOUS
      - OFFSET
    PanelDto:
      required:
      - cards
      - id
      - name
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/PanelDto.PanelCardDto"
    PanelDto.PanelCardDto:
      required:
      - id
      - ruleId
      type: object
      properties:
        id:
          type: string
        ruleId:
          type: string
        title:
          type: string
          nullable: true
    PanelsApi.ListPanelsResponse:
      type: object
      allOf:
      - $ref: "#/components/schemas/Page_PanelDto_"
      - $ref: "#/components/schemas/Slice_PanelDto_"
    SetEnabled.SetEnabledCommand:
      required:
      - ruleId
      type: object
      properties:
        ruleId:
          minLength: 1
          type: string
    SetState.SetStateCommand:
      required:
      - rules
      - variables
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRuleDto"
        variables:
          type: array
          items:
            $ref: "#/components/schemas/AutomationVariableDto"
    Slice_AlertData_:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - pageable
      - size
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AlertData"
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Slice_AutomationRuleDto_:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - pageable
      - size
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AutomationRuleDto"
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Slice_AutomationVariableDto_:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - pageable
      - size
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AutomationVariableDto"
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Slice_PanelDto_:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - pageable
      - size
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PanelDto"
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Sort:
      required:
      - orderBy
      type: object
      properties:
        orderBy:
          type: array
          items:
            $ref: "#/components/schemas/Sort.Order"
    Sort.Order:
      required:
      - ascending
      - direction
      - ignoreCase
      - property
      type: object
      properties:
        ignoreCase:
          type: boolean
        direction:
          $ref: "#/components/schemas/Sort.Order.Direction"
        property:
          type: string
        ascending:
          type: boolean
    Sort.Order.Direction:
      type: string
      enum:
      - ASC
      - DESC
    TriggerRuleApi.TriggerRuleCommand:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
        nickname:
          type: string
          nullable: true
        system:
          type: string
          nullable: true
        variables:
          type: object
          additionalProperties:
            type: string
          nullable: true
    UpdateBlacklistApi.UpdateBlacklistCommand:
      required:
      - words
      type: object
      properties:
        words:
          type: array
          items:
            type: string
    UpdatePanelApi.UpdatePanelCommand:
      required:
      - cards
      - id
      - name
      type: object
      properties:
        id:
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/PanelDto.PanelCardDto"
    Void:
      type: object
    WordFilterData:
      required:
      - id
      - recipientId
      - words
      type: object
      properties:
        id:
          type: string
        recipientId:
          type: string
        words:
          type: array
          items:
            type: string
