openapi: 3.0.1
info:
  title: oda-streamelements-service
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 0.3.0
paths:
  /streamelements/channels/{channel}:
    get:
      operationId: getChannel
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getChannel 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamElementsChannelView"
  /streamelements/import-overlay:
    post:
      operationId: importOverlay
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamElementsImportOverlayController.ImportOverlayRequest"
        required: true
      responses:
        "200":
          description: importOverlay 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayWidgetImportResult"
  /streamelements/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: getSession 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamElementsSessionView"
components:
  schemas:
    ConversionWarning:
      required:
      - fallback
      - reason
      - seName
      - seType
      - seWidgetId
      type: object
      properties:
        seWidgetId:
          type: string
        seType:
          type: string
        seName:
          type: string
        reason:
          type: string
        fallback:
          type: string
    OverlayWidgetImportResult:
      required:
      - warnings
      - widgetId
      type: object
      properties:
        widgetId:
          type: string
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ConversionWarning"
      description: Outcome of importing an overlay into a newly created ODA widget.
    StreamElementsChannelView:
      required:
      - _id
      - alias
      - avatar
      - broadcasterType
      - displayName
      - inactive
      - isPartner
      - profile
      - provider
      - providerId
      - suspended
      - username
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/StreamElementsChannelView.Profile"
        _id:
          type: string
        isPartner:
          type: boolean
        providerId:
          type: string
        displayName:
          type: string
        username:
          type: string
        avatar:
          type: string
        suspended:
          type: boolean
        provider:
          type: string
        broadcasterType:
          type: string
        alias:
          type: string
        inactive:
          type: boolean
    StreamElementsChannelView.Profile:
      required:
      - headerImage
      - title
      type: object
      properties:
        title:
          type: string
        headerImage:
          type: string
    StreamElementsImportOverlayController.ImportOverlayRequest:
      required:
      - tokenId
      - url
      type: object
      properties:
        url:
          type: string
        tokenId:
          type: string
    StreamElementsSessionView:
      required:
      - channel
      - session
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/StreamElementsSessionView.Channel"
        session:
          $ref: "#/components/schemas/StreamElementsSessionView.ViewSession"
    StreamElementsSessionView.Channel:
      required:
      - username
      type: object
      properties:
        username:
          type: string
    StreamElementsSessionView.ViewData:
      required:
      - tip-goal
      - tip-latest
      type: object
      properties:
        tip-latest:
          $ref: "#/components/schemas/StreamElementsSessionView.ViewTip"
        tip-goal:
          $ref: "#/components/schemas/StreamElementsSessionView.ViewTip"
        follower-latest:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/StreamElementsSessionView.ViewFollower"
        subscriber-latest:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/StreamElementsSessionView.ViewSubscriber"
        raid-latest:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/StreamElementsSessionView.ViewRaid"
    StreamElementsSessionView.ViewFollower:
      required:
      - name
      type: object
      properties:
        name:
          type: string
    StreamElementsSessionView.ViewRaid:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        viewerCount:
          type: integer
          format: int32
          nullable: true
    StreamElementsSessionView.ViewSession:
      required:
      - data
      type: object
      properties:
        data:
          $ref: "#/components/schemas/StreamElementsSessionView.ViewData"
    StreamElementsSessionView.ViewSubscriber:
      required:
      - name
      type: object
      properties:
        name:
          type: string
        tier:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        cumulativeMonths:
          type: integer
          format: int32
          nullable: true
        totalMonths:
          type: integer
          format: int32
          nullable: true
        streakMonths:
          type: integer
          format: int32
          nullable: true
    StreamElementsSessionView.ViewTip:
      required:
      - amount
      - name
      type: object
      properties:
        name:
          type: string
        amount:
          type: integer
          format: int64
