openapi: 3.0.1
info:
  title: ODA News Service
  description: News Service API
  contact:
    name: stCarolas
    email: stcarolas@gmail.com
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 0.7.0
paths:
  /advice/commands/add-advice:
    post:
      operationId: addAdvice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdvice.AddAdviceCommand"
        required: true
      responses:
        "200":
          description: addAdvice 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceDto"
  /advice/commands/get-random-advice:
    get:
      operationId: getRandomAdvice
      responses:
        "200":
          description: getRandomAdvice 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceDto"
  /feed/commands/mark-as-read:
    post:
      operationId: markAsRead
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAsRead.MarkAsReadCommand"
        required: true
      responses:
        "200":
          description: markAsRead 200 response
  /feed/news:
    get:
      operationId: getFeed
      responses:
        "200":
          description: getFeed 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsDto"
  /news:
    get:
      operationId: getNews
      parameters:
      - name: pageable
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: getNews 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_NewsDto_"
  /news/commands/add-news:
    post:
      operationId: addNews
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddNews.AddNewsCommand"
        required: true
      responses:
        "200":
          description: addNews 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsDto"
  /news/{newsId}/feedback/commands/create:
    post:
      operationId: createFeedback
      parameters:
      - name: newsId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackCommand"
        required: true
      responses:
        "200":
          description: createFeedback 200 response
  /warnings:
    get:
      operationId: getWarnings
      responses:
        "200":
          description: getWarnings 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WarningData"
  /warnings/commands/clear:
    post:
      operationId: clearWarnings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningCommandsController.ClearWarningsCommand"
        required: true
      responses:
        "200":
          description: clearWarnings 200 response
  /warnings/commands/create:
    post:
      operationId: addWarning
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarningCommandsController.AddWarningCommand"
        required: true
      responses:
        "200":
          description: addWarning 200 response
components:
  schemas:
    AddAdvice.AddAdviceCommand:
      required:
      - text
      type: object
      properties:
        text:
          type: string
    AddNews.AddNewsCommand:
      required:
      - description
      - global
      - title
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        demoUrl:
          type: string
          nullable: true
        global:
          type: boolean
    AdviceDto:
      required:
      - id
      - text
      type: object
      properties:
        id:
          type: string
        text:
          type: string
    CreateFeedbackCommand:
      required:
      - rating
      type: object
      properties:
        rating:
          type: integer
          format: int32
    MarkAsRead.MarkAsReadCommand:
      required:
      - newsId
      type: object
      properties:
        newsId:
          type: string
    NewsDto:
      required:
      - date
      - description
      - id
      - title
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        date:
          type: string
        demoUrl:
          type: string
          nullable: true
    Page_NewsDto_:
      required:
      - totalPages
      - totalSize
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_NewsDto_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Pageable:
      required:
      - mode
      - number
      - size
      - sort
      type: object
      allOf:
      - $ref: "#/components/schemas/Sort"
      - type: object
        properties:
          number:
            type: integer
            format: int32
          size:
            type: integer
            format: int32
          mode:
            $ref: "#/components/schemas/Pageable.Mode"
          sort:
            $ref: "#/components/schemas/Sort"
    Pageable.Mode:
      type: string
      enum:
      - CURSOR_NEXT
      - CURSOR_PREVIOUS
      - OFFSET
    Slice_NewsDto_:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - pageable
      - size
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/NewsDto"
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Sort:
      required:
      - orderBy
      type: object
      properties:
        orderBy:
          type: array
          items:
            $ref: "#/components/schemas/Sort.Order"
    Sort.Order:
      required:
      - ascending
      - direction
      - ignoreCase
      - property
      type: object
      properties:
        ignoreCase:
          type: boolean
        direction:
          $ref: "#/components/schemas/Sort.Order.Direction"
        property:
          type: string
        ascending:
          type: boolean
    Sort.Order.Direction:
      type: string
      enum:
      - ASC
      - DESC
    WarningCommandsController.AddWarningCommand:
      required:
      - message
      type: object
      properties:
        message:
          type: string
        component:
          type: string
          nullable: true
    WarningCommandsController.ClearWarningsCommand:
      type: object
      properties:
        components:
          type: array
          nullable: true
          items:
            type: string
    WarningData:
      required:
      - message
      type: object
      properties:
        message:
          type: string
        component:
          type: string
          nullable: true
