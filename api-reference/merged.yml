openapi: 3.0.1
info:
  title: ODA Client
  version: 1.0.0
  description: Merged OpenAPI specification for all OpenDonationAssistant microservices.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
tags:
  - name: Actions
  - name: Automation
  - name: Config
  - name: Files
  - name: Font
  - name: History
  - name: Kick
  - name: Max
  - name: Media
  - name: News
  - name: Payment
  - name: Paywall
  - name: Recipient
  - name: Streamelements
  - name: Subscriptions
  - name: Tribute
  - name: Twitch
  - name: Vk
  - name: Widget
paths:
  /actions:
    get:
      summary: Get actions
      description: Retrieves actions filtered by recipientId and optional parameters
      operationId: getActions
      parameters:
        - name: recipientId
          in: query
          description: Owner recipient ID
          required: true
          explode: false
          schema:
            type: string
        - name: game
          in: query
          description: Filter by game
          explode: false
          schema:
            type: string
            nullable: true
        - name: enabled
          in: query
          description: Filter by enabled status
          explode: false
          schema:
            type: boolean
            nullable: true
        - name: category
          in: query
          description: Filter by category
          explode: false
          schema:
            type: string
            nullable: true
        - name: provider
          in: query
          description: Filter by provider
          explode: false
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Actions retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionControllerApi.ActionDto"
      tags:
        - Actions
  /actions/commands/add-actions:
    post:
      summary: Add actions
      description: Add new actions to the system
      operationId: addAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddActionApi.AddActionsCommand"
        required: true
      responses:
        "200":
          description: Actions successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddActionApi.AddActionResult"
      tags:
        - Actions
  /actions/commands/delete-actions:
    post:
      summary: Delete actions
      description: Deletes actions by their IDs, category, or provider
      operationId: deleteActions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteActionsApi.DeleteActionsCommand"
        required: true
      responses:
        "200":
          description: Actions successfully deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteActionsApi.DeleteActionsResult"
      tags:
        - Actions
  /actions/commands/disable-actions:
    post:
      summary: Disable actions
      description: Disables actions by their IDs, category, provider, or game
      operationId: disableActions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableActionsApi.DisableActionsCommand"
        required: true
      responses:
        "200":
          description: Actions successfully disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisableActionsApi.DisableActionsResult"
      tags:
        - Actions
  /actions/commands/enable-actions:
    post:
      summary: Enable actions
      description: Enables actions by their IDs, category, provider, or game
      operationId: enableActions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableActionsApi.EnableActionsCommand"
        required: true
      responses:
        "200":
          description: Actions successfully enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnableActionsApi.EnableActionsResult"
      tags:
        - Actions
  /advice/commands/add-advice:
    post:
      operationId: addAdvice
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAdvice.AddAdviceCommand"
        required: true
      responses:
        "200":
          description: addAdvice 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceDto"
      tags:
        - News
  /advice/commands/get-random-advice:
    get:
      operationId: getRandomAdvice
      responses:
        "200":
          description: getRandomAdvice 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdviceDto"
      tags:
        - News
  /alerts:
    get:
      summary: List alerts
      description: Retrieves paginated alerts for the authenticated user with optional
        filters
      operationId: listAlerts
      parameters:
        - name: after
          in: query
          explode: false
          schema:
            type: string
            format: date-time
            nullable: true
        - name: before
          in: query
          explode: false
          schema:
            type: string
            format: date-time
            nullable: true
        - name: pageable
          in: query
          required: true
          explode: false
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated list of alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAlertsApi.GetAlertsApiResponse"
        "401":
          description: Unauthorized - user not authenticated
      tags:
        - Automation
  /apps:
    get:
      summary: List OpenID Connect applications
      description: Returns all OpenID Connect applications for the authenticated user
      operationId: getApps
      responses:
        "200":
          description: OpenID Connect applications found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcController.GetAppsResponse"
        "401":
          description: Unauthorized
      tags:
        - Subscriptions
  /apps/commands/change-oidc-app-settings:
    post:
      summary: Change OpenID Connect application settings
      description: Updates the name, description and redirect URIs of an existing
        OpenID Connect client application in Keycloak
      operationId: changeOidcAppSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOidcAppSettings.ChangeOidcAppSettingsCommand"
        required: true
      responses:
        "200":
          description: OpenID Connect application settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "401":
          description: Unauthorized
          content:
            application/json: {}
      tags:
        - Subscriptions
  /apps/commands/deregister-oidc-client:
    post:
      summary: Deregister OpenID Connect application
      description: Deletes an existing OpenID Connect client application from Keycloak
      operationId: deregisterOidcApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterOidcApplication.DeregisterOidcClientComma\
                nd"
        required: true
      responses:
        "200":
          description: OpenID Connect application deregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "401":
          description: Unauthorized
          content:
            application/json: {}
      tags:
        - Subscriptions
  /apps/commands/refresh-client-secret:
    post:
      summary: Refresh OpenID Connect client secret
      description: Regenerates the client secret of an existing OpenID Connect client
        application in Keycloak
      operationId: refreshClientSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshClientSecret.RefreshClientSecretCommand"
        required: true
      responses:
        "200":
          description: Client secret regenerated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshClientSecret.RefreshedClientSecret"
        "401":
          description: Unauthorized
          content:
            application/json: {}
        "404":
          description: OpenID Connect application not mapped to user
          content:
            application/json: {}
      tags:
        - Subscriptions
  /apps/commands/register-oidc-client:
    post:
      summary: Register OpenID Connect application
      description: Creates a new OpenID Connect client application in Keycloak and,
        generates its client secret
      operationId: registerOidcApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOidcClientCommand"
        required: true
      responses:
        "200":
          description: OpenID Connect application registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcClientRegistrationResult"
        "401":
          description: Unauthorized
          content:
            application/json: {}
      tags:
        - Subscriptions
  /automation:
    get:
      tags:
        - Automation
      summary: Get automation state
      description: Retrieves the complete automation state including all rules and variables
      operationId: getState
      responses:
        "200":
          description: Complete automation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationDto"
        "401":
          description: Unauthorized - user not authenticated
  /automation/commands/set-enabled:
    post:
      summary: Toggle automation rule enabled state
      description: Toggles the enabled field for an automation rule by id for the
        authenticated user
      operationId: setEnabled
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEnabled.SetEnabledCommand"
        required: true
      responses:
        "200":
          description: Rule enabled state toggled
        "401":
          description: Unauthorized - user not authenticated
        "404":
          description: Rule not found
      tags:
        - Automation
  /automation/commands/set-state:
    post:
      summary: Set automation state
      description: Updates automation variables and rules for the authenticated user
      operationId: setState
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetState.SetStateCommand"
        required: true
      responses:
        "200":
          description: State successfully updated
        "401":
          description: Unauthorized - user not authenticated
      tags:
        - Automation
  /automation/rules:
    get:
      tags:
        - Automation
      summary: List automation rules
      description: Retrieves all automation rules for the authenticated user
      operationId: listAutomations
      responses:
        "200":
          description: List of automation rules
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized - user not authenticated
  /automation/variables:
    get:
      tags:
        - Automation
      summary: List automation variables
      description: Retrieves all automation variables for the authenticated user
      operationId: listVariables
      responses:
        "200":
          description: List of automation variables
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized - user not authenticated
  /catalog:
    get:
      operationId: getCatalog
      parameters:
        - name: category
          in: query
          explode: false
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: getCatalog 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItemView"
      tags:
        - Files
  /commands/media/linkPayment:
    post:
      operationId: linkPayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPayment.LinkPaymentCommand"
        required: true
      responses:
        "200":
          description: linkPayment 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPayment.LinkPaymentResponse"
      tags:
        - Media
  /config:
    put:
      operationId: config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigValue"
        required: true
      responses:
        "200":
          description: put 200 response
      tags:
        - Config
  /config/{id}:
    post:
      operationId: config_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigValue"
        required: true
      responses:
        "200":
          description: update 200 response
      tags:
        - Config
  /config/{name}:
    get:
      operationId: config_get
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: ownerId
          in: query
          required: true
          explode: false
          schema:
            type: string
        - name: url
          in: query
          required: true
          explode: false
          schema:
            type: string
      responses:
        "200":
          description: get 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigValue"
      tags:
        - Config
  /config/commands/change-agreement:
    post:
      operationId: changeAgreement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeAgreement.ChangeAgreementCommand"
        required: true
      responses:
        "200":
          description: changeAgreement 200 response
      tags:
        - Config
  /config/commands/change-socials:
    post:
      operationId: changeSocials
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSocials.ChangeSocialsCommand"
        required: true
      responses:
        "200":
          description: changeSocials 200 response
      tags:
        - Config
  /config/commands/create-config:
    post:
      operationId: createConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfig.CreateConfigCommand"
        required: true
      responses:
        "200":
          description: createConfig 200 response
      tags:
        - Config
  /feed/commands/mark-as-read:
    post:
      operationId: markAsRead
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAsRead.MarkAsReadCommand"
        required: true
      responses:
        "200":
          description: markAsRead 200 response
      tags:
        - News
  /feed/news:
    get:
      operationId: getFeed
      responses:
        "200":
          description: getFeed 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsDto"
      tags:
        - News
  /files/{name}:
    get:
      operationId: files_get
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: get 200 response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
        - Files
    put:
      operationId: files_put
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: public
          in: query
          explode: false
          schema:
            type: boolean
            nullable: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: put 200 response
      tags:
        - Files
  /fonts:
    get:
      tags:
        - Font
      summary: List fonts
      description: Retrieves a list of fonts filtered by optional criteria for the
        authenticated user
      operationId: listFonts
      parameters:
        - name: subset
          in: query
          description: Unicode subset to filter fonts (e.g., 'latin', 'cyrillic')
          explode: false
          schema:
            type: string
            nullable: true
        - name: category
          in: query
          description: Font category to filter by (e.g., 'serif', 'sans-serif')
          explode: false
          schema:
            type: string
            nullable: true
        - name: name
          in: query
          description: Font name to search for (partial match)
          explode: false
          schema:
            type: string
            nullable: true
      responses:
        "200":
          description: Fonts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FontApi.FontDto"
        "401":
          description: Unauthorized - user not authenticated
      security:
        - BearerAuth: []
  /fonts/commands/refresh:
    post:
      tags:
        - Font
      summary: Refresh fonts
      description: Fetches the latest fonts from the Fontsource API and updates the cache
      operationId: font_refresh
      responses:
        "200":
          description: Fonts refreshed successfully
      security:
        - BearerAuth: []
  /fonts/commands/upload:
    put:
      tags:
        - Font
      summary: Upload font
      description: Uploads a TTF font file and stores it in the user's font collection
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/octet-stream
                explode: false
        required: true
      responses:
        "200":
          description: Font uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FontApi.FontDto"
        "401":
          description: Unauthorized - user not authenticated
      security:
        - BearerAuth: []
  /history:
    get:
      summary: Get donation history
      description: Retrieves paginated donation history for the authenticated user
      operationId: getHistory
      parameters:
        - name: page
          in: query
          description: Zero-indexed page number (0-based)
          required: false
          schema:
            minimum: 0
            type: integer
            format: int32
            example: 0
        - name: size
          in: query
          description: Number of items per page
          schema:
            type: integer
            format: int32
        - name: sort
          in: query
          description: "Sorting criteria in format: property,asc|desc"
          schema:
            type: string
        - name: systems
          in: query
          explode: false
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: events
          in: query
          explode: false
          schema:
            type: array
            nullable: true
            items:
              type: string
        - name: after
          in: query
          explode: false
          schema:
            type: string
            format: date-time
            nullable: true
        - name: before
          in: query
          explode: false
          schema:
            type: string
            format: date-time
            nullable: true
      responses:
        "200":
          description: Successfully retrieved history items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHistoryApi.GetHistoryResponse"
        "401":
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
      tags:
        - History
  /history/commands/add-item:
    post:
      summary: Add a new history item
      description: Creates a new donation history item for the authenticated user
      operationId: addHistoryItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand"
        required: true
      responses:
        "200":
          description: Successfully created the history item
      tags:
        - History
  /history/commands/delete-item:
    post:
      summary: Delete a history item
      description: Soft-deletes a history item by setting the deleted flag to true
      operationId: deleteItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteHistoryItemApi.DeleteHistoryItemCommand"
        required: true
      responses:
        "200":
          description: Successfully deleted the history item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "404":
          description: History item not found
      tags:
        - History
  /history/commands/print-csv:
    post:
      operationId: printCsv
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintCsv.PrintCsvCommand"
        required: true
      responses:
        "200":
          description: Successfully ordered the print
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintCsv.PrintCsvResponse"
      tags:
        - History
  /history/commands/repeat-alert:
    post:
      summary: Repeat an alert
      description: Repeats an alert for a given history item
      operationId: repeatAlert
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepeatAlertApi.RepeatAlertCommand"
        required: true
      responses:
        "200":
          description: Successfully repeated the alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "404":
          description: History item not found
      tags:
        - History
  /history/csv/{id}:
    get:
      operationId: downloadCsv
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: downloadCsv 200 response
          content:
            text/csv:
              schema:
                type: string
                format: binary
      tags:
        - History
  /history/csv/{id}/status:
    get:
      operationId: getCsvStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: getCsvStatus 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadCsv.CsvStatus"
      tags:
        - History
  /kick/commands/get-channel-info:
    post:
      summary: Get kick channel info
      description: Get kick channel info
      operationId: getChatroomId
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetChannelInfo.GetChannelInfoCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetChannelInfo.ChannelInfo"
      tags:
        - Kick
  /max/accounts:
    get:
      operationId: accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaxController.AccountDto"
      tags:
        - Max
  /max/announcers:
    get:
      operationId: announcers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaxController.AnnouncerDto"
      tags:
        - Max
  /max/commands/add-announcer:
    post:
      operationId: addAnnouncer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAnnouncer.AddAnnouncerRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
      tags:
        - Max
  /max/commands/delete-account:
    post:
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccount.DeleteAccountCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
      tags:
        - Max
  /max/commands/generate-link:
    post:
      operationId: generateLink
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateLink.TemporaryLink"
      tags:
        - Max
  /max/commands/list-available-chats:
    post:
      operationId: listAvailableChats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListAvailableChats.ChatDto"
      tags:
        - Max
  /max/commands/toggle-account:
    post:
      operationId: toggleAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleAccount.ToggleAccountCommand"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
      tags:
        - Max
