openapi: 3.0.1
info:
  title: oda-history-service
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  version: 0.19.0
paths:
  /history:
    get:
      summary: Get donation history
      description: Retrieves paginated donation history for the authenticated user
      operationId: getHistory
      parameters:
      - name: page
        in: query
        description: Zero-indexed page number (0-based)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          example: 0
      - name: size
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: "Sorting criteria in format: property,asc|desc"
        schema:
          type: string
      - name: systems
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: events
        in: query
        explode: false
        schema:
          type: array
          nullable: true
          items:
            type: string
      - name: after
        in: query
        explode: false
        schema:
          type: string
          format: date-time
          nullable: true
      - name: before
        in: query
        explode: false
        schema:
          type: string
          format: date-time
          nullable: true
      responses:
        "200":
          description: Successfully retrieved history items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetHistoryApi.GetHistoryResponse"
        "401":
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
  /history/commands/add-item:
    post:
      summary: Add a new history item
      description: Creates a new donation history item for the authenticated user
      operationId: addHistoryItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand"
        required: true
      responses:
        "200":
          description: Successfully created the history item
  /history/commands/delete-item:
    post:
      summary: Delete a history item
      description: Soft-deletes a history item by setting the deleted flag to true
      operationId: deleteItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteHistoryItemApi.DeleteHistoryItemCommand"
        required: true
      responses:
        "200":
          description: Successfully deleted the history item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "404":
          description: History item not found
  /history/commands/print-csv:
    post:
      operationId: printCsv
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintCsv.PrintCsvCommand"
        required: true
      responses:
        "200":
          description: Successfully ordered the print
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintCsv.PrintCsvResponse"
  /history/commands/repeat-alert:
    post:
      summary: Repeat an alert
      description: Repeats an alert for a given history item
      operationId: repeatAlert
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepeatAlertApi.RepeatAlertCommand"
        required: true
      responses:
        "200":
          description: Successfully repeated the alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Void"
        "404":
          description: History item not found
  /history/csv/{id}:
    get:
      operationId: downloadCsv
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: downloadCsv 200 response
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /history/csv/{id}/status:
    get:
      operationId: getCsvStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getCsvStatus 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadCsv.CsvStatus"
components:
  schemas:
    AddHistoryItemApi.AddHistoryItemCommand:
      type: object
      properties:
        paymentId:
          type: string
          description: Payment ID from the source system
          nullable: true
        nickname:
          type: string
          description: Donor's nickname
        recipientId:
          type: string
          description: Recipient ID (streamer/creator)
        amount:
          description: Donation amount
          allOf:
          - $ref: "#/components/schemas/Amount"
        message:
          type: string
          description: Message from the donor
        authorizationTimestamp:
          type: string
          description: Authorization timestamp
          format: date-time
        system:
          type: string
          description: Source system name
        externalId:
          type: string
          description: External ID from the source system
          nullable: true
        attachments:
          type: array
          description: Attached media files
          items:
            $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand.Attachment"
        links:
          type: array
          description: Attached media links
          items:
            type: string
        goals:
          type: array
          description: Target goals
          items:
            $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand.TargetGoal"
        reelResults:
          type: array
          description: Reel results from social media
          items:
            $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand.ReelResult"
        actions:
          type: array
          description: Action requests triggered by the donation
          items:
            $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand.ActionRequest"
        alertMedia:
          description: Alert media URL
          nullable: true
          allOf:
          - $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand.AlertMedia"
        vote:
          description: Vote information
          nullable: true
          allOf:
          - $ref: "#/components/schemas/AddHistoryItemApi.AddHistoryItemCommand.Vote"
        event:
          type: string
          description: Event type
        count:
          type: integer
          description: Related item count
          format: int32
          nullable: true
        level:
          type: integer
          description: Boosty subscription level
          format: int32
          nullable: true
        levelName:
          type: string
          description: Boosty subscription level name
          nullable: true
        triggerAlert:
          type: boolean
          description: Whether to trigger an alert
        triggerReel:
          type: boolean
          description: Whether to trigger a reel
        triggerDonaton:
          type: boolean
          description: Whether to trigger donation processing
        addToGoal:
          type: boolean
          description: Whether to add to goal
        addToTop:
          type: boolean
          description: Whether to add to top
      description: Command to add a new history item
    AddHistoryItemApi.AddHistoryItemCommand.ActionRequest:
      type: object
      properties:
        id:
          type: string
          description: Action request ID
        actionId:
          type: string
          description: Action ID
        name:
          type: string
          description: Action name
        amount:
          type: integer
          description: Amount required for the action
          format: int32
        payload:
          type: object
          additionalProperties:
            type: object
          description: Action payload data
      description: Action request triggered by donation
    AddHistoryItemApi.AddHistoryItemCommand.AlertMedia:
      type: object
      properties:
        url:
          type: string
          description: Alert media URL
      description: Alert media
    AddHistoryItemApi.AddHistoryItemCommand.Attachment:
      type: object
      properties:
        id:
          type: string
          description: Attachment ID
      description: Media attachment
    AddHistoryItemApi.AddHistoryItemCommand.ReelResult:
      type: object
      properties:
        title:
          type: string
          description: Title of the reel
      description: Reel result from social media
    AddHistoryItemApi.AddHistoryItemCommand.TargetGoal:
      type: object
      properties:
        goalId:
          type: string
          description: Goal ID
        goalTitle:
          type: string
          description: Goal title
      description: Target goal
    AddHistoryItemApi.AddHistoryItemCommand.Vote:
      type: object
      properties:
        id:
          type: string
          description: Vote ID
          nullable: true
        name:
          type: string
          description: Vote name
        isNew:
          type: boolean
          description: Is this a new vote?
      description: Vote information
    Amount:
      required:
      - currency
      - major
      - minor
      type: object
      properties:
        minor:
          type: integer
          format: int32
        major:
          type: integer
          format: int32
        currency:
          type: string
      description: Donation amount
    DeleteHistoryItemApi.DeleteHistoryItemCommand:
      type: object
      properties:
        historyItemId:
          type: string
          description: ID of the history item to delete
      description: Command to delete a history item
    DownloadCsv.CsvStatus:
      required:
      - ready
      type: object
      properties:
        ready:
          type: boolean
    GetHistoryApi.GetHistoryResponse:
      type: object
      allOf:
      - $ref: "#/components/schemas/Page_HistoryItemData_"
      - $ref: "#/components/schemas/Slice_HistoryItemData_"
    HistoryItemData:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the history item
        type:
          type: string
          description: "Type of event (e.g., payment, goal)"
        recipientId:
          type: string
          description: Recipient ID (streamer/creator)
        system:
          type: string
          description: "Source system (e.g., donate.stream, donatello)"
        originId:
          type: string
          description: Original ID from the source system
          nullable: true
        timestamp:
          type: string
          description: Timestamp of the event
          format: date-time
        nickname:
          type: string
          description: Donor's nickname
          nullable: true
        amount:
          description: Donation amount
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Amount"
        message:
          type: string
          description: Message from the donor
          nullable: true
        attachments:
          type: array
          description: Attached media files
          items:
            $ref: "#/components/schemas/HistoryItemData.Attachment"
        goals:
          type: array
          description: Target goals associated with the donation
          items:
            $ref: "#/components/schemas/HistoryItemData.TargetGoal"
        reelResults:
          type: array
          description: Reel results from Instagram/Facebook
          items:
            $ref: "#/components/schemas/HistoryItemData.ReelResult"
        actions:
          type: array
          description: Action requests triggered by the donation
          items:
            $ref: "#/components/schemas/HistoryItemData.ActionRequest"
        vote:
          description: Vote associated with the donation
          nullable: true
          allOf:
          - $ref: "#/components/schemas/HistoryItemData.Vote"
        alerts:
          type: array
          description: Alerts shown to the streamer
          items:
            $ref: "#/components/schemas/HistoryItemData.Alert"
        level:
          type: integer
          format: int32
          nullable: true
        count:
          type: integer
          format: int32
          nullable: true
        levelName:
          type: string
          nullable: true
        deleted:
          type: boolean
          description: Soft-delete flag for history item
        metadata:
          type: object
          additionalProperties:
            type: object
          description: Additional metadata associated with the history item
      description: History item representing a donation or event
    HistoryItemData.ActionRequest:
      type: object
      properties:
        id:
          type: string
          description: Action request ID
        actionId:
          type: string
          description: Action ID
        name:
          type: string
          description: Action name
        amount:
          type: integer
          description: Amount required for the action
          format: int32
        payload:
          type: object
          additionalProperties:
            type: object
          description: Action payload data
      description: Action request triggered by donation
    HistoryItemData.Alert:
      type: object
      properties:
        id:
          type: string
          description: Alert ID
        shownAt:
          type: string
          description: When the alert was shown
          format: date-time
      description: Alert shown to streamer
    HistoryItemData.Attachment:
      type: object
      properties:
        id:
          type: string
          description: Attachment ID
        url:
          type: string
          description: URL to the media
        title:
          type: string
          description: Title of the media
        thumbnail:
          type: string
          description: Thumbnail URL
      description: Media attachment
    HistoryItemData.ReelResult:
      type: object
      properties:
        title:
          type: string
          description: Title of the reel
      description: Reel result from social media
    HistoryItemData.TargetGoal:
      type: object
      properties:
        goalId:
          type: string
          description: Goal ID
        goalTitle:
          type: string
          description: Goal title
      description: Target goal
    HistoryItemData.Vote:
      type: object
      properties:
        id:
          type: string
          description: Vote ID
          nullable: true
        name:
          type: string
          description: Vote name
        isNew:
          type: boolean
          description: Is this a new vote?
      description: Vote voting
    Page_HistoryItemData_:
      required:
      - totalPages
      - totalSize
      type: object
      allOf:
      - $ref: "#/components/schemas/Slice_HistoryItemData_"
      - type: object
        properties:
          totalSize:
            type: integer
            format: int64
          totalPages:
            type: integer
            format: int32
    Pageable:
      required:
      - mode
      - number
      - size
      - sort
      type: object
      allOf:
      - $ref: "#/components/schemas/Sort"
      - type: object
        properties:
          number:
            type: integer
            format: int32
          size:
            type: integer
            format: int32
          mode:
            $ref: "#/components/schemas/Pageable.Mode"
          sort:
            $ref: "#/components/schemas/Sort"
    Pageable.Mode:
      type: string
      enum:
      - CURSOR_NEXT
      - CURSOR_PREVIOUS
      - OFFSET
    PrintCsv.PrintCsvCommand:
      type: object
      properties:
        systems:
          type: array
          nullable: true
          items:
            type: string
        events:
          type: array
          nullable: true
          items:
            type: string
        after:
          type: string
          format: date-time
          nullable: true
        before:
          type: string
          format: date-time
          nullable: true
    PrintCsv.PrintCsvResponse:
      required:
      - printId
      type: object
      properties:
        printId:
          type: string
    RepeatAlertApi.RepeatAlertCommand:
      type: object
      properties:
        historyItemId:
          type: string
          description: ID of the history item
      description: Command to repeat an alert
    Slice_HistoryItemData_:
      required:
      - content
      - empty
      - numberOfElements
      - offset
      - pageNumber
      - pageable
      - size
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItemData"
        pageable:
          $ref: "#/components/schemas/Pageable"
        pageNumber:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        empty:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
    Sort:
      required:
      - orderBy
      type: object
      properties:
        orderBy:
          type: array
          items:
            $ref: "#/components/schemas/Sort.Order"
    Sort.Order:
      required:
      - ascending
      - direction
      - ignoreCase
      - property
      type: object
      properties:
        ignoreCase:
          type: boolean
        direction:
          $ref: "#/components/schemas/Sort.Order.Direction"
        property:
          type: string
        ascending:
          type: boolean
    Sort.Order.Direction:
      type: string
      enum:
      - ASC
      - DESC
    Void:
      type: object
